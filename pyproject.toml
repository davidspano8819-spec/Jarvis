[project]
name = "jarvis"
version = "0.1.0"
description = "J.A.R.V.I.S. — assistente personale vocale in italiano"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8,<2",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["server"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["server", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "server"
packages = ["jarvis"]
